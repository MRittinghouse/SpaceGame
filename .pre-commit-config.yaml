default_language_version:
  python: python3.13

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.14.13
    hooks:
      - id: ruff
        # Scope: spacegame/ only. tests/ has 874 pre-existing lint findings that are
        # out of this sprint's scope (Decision 1 in QF-1 plan). Widening to tests/ would
        # either fail the hook from day one or require an out-of-scope 874-item cleanup.
        # See QF-1 Activity log for the full rationale; a follow-up sprint can address tests/.
        args: [spacegame/]
        pass_filenames: false
      - id: ruff-format
        args: [--check, spacegame/, tests/]
        pass_filenames: false
  - repo: local
    hooks:
      - id: mypy-baseline
        name: mypy (against baseline)
        language: system
        entry: "bash -c 'python -m mypy spacegame/ | grep -v \": note:\" | python -m mypy_baseline filter'"
        pass_filenames: false
        types_or: [python]
      - id: mypy-crawler-strict
        name: mypy tools/crawler (zero tolerance, no baseline)
        # tools/crawler/ was born clean (0 errors) under the QF arc. Gate it at
        # zero from day one so the play harness cannot accumulate debt the way
        # spacegame/ did. --follow-imports=silent stops mypy from dragging in
        # spacegame/'s 768 baselined errors through the crawler's imports.
        # The legacy tools/ scripts (~198 errors) stay out of scope: build-time
        # utilities, not shipped code.
        language: system
        entry: "python -m mypy tools/crawler/ --follow-imports=silent"
        pass_filenames: false
        types_or: [python]
