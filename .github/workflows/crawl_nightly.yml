name: crawl-nightly

on:
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch:

concurrency:
  group: crawl-nightly
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  crawl:
    strategy:
      matrix:
        checkpoint: [early, mid, late]
        seed: [42, 137]
      fail-fast: false
    runs-on: ubuntu-latest
    env:
      SDL_VIDEODRIVER: dummy
      SDL_AUDIODRIVER: dummy
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'
          cache-dependency-path: pyproject.toml
      - name: Install SDL runtime
        run: sudo apt-get update && sudo apt-get install -y libsdl2-2.0-0 libsdl2-image-2.0-0 libsdl2-mixer-2.0-0 libsdl2-ttf-2.0-0
      - run: pip install -e ".[dev]"
      - name: Run crawler (nightly sweep)
        run: |
          python -m tools.crawler \
            --seed ${{ matrix.seed }} \
            --actions 5000 \
            --checkpoint ${{ matrix.checkpoint }} \
            --screenshot-dir screenshots \
            --crash-baseline tools/crawler/crash_baseline.json \
            --output-dir crawler_runs
      - name: Upload crawler artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: crawler-nightly-${{ github.run_id }}-${{ matrix.checkpoint }}-${{ matrix.seed }}
          path: crawler_runs/
          retention-days: 30
